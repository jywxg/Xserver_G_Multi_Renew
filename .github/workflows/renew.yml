name: XServer Extend (Node.js)

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制续期，跳过预检'
        default: false
        required: false
        type: boolean
  repository_dispatch:
    types: [renew-trigger]

permissions:
  contents: write
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 📥 拉取仓库
        uses: actions/checkout@v4

      - name: 🧩 动态解析账号列表
        id: set-matrix
        shell: bash
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          ACCOUNTS=$(echo "$ALL_SECRETS" | jq -r 'keys[] | select(startswith("EML_"))' | sed 's/EML_//' | shuf)
          if [ -z "$ACCOUNTS" ]; then
            HAS_SINGLE=$(echo "$ALL_SECRETS" | jq -r 'keys[] | select(. == "EML")')
            if [ -n "$HAS_SINGLE" ]; then
              echo "matrix=[\"SINGLE\"]" >> $GITHUB_OUTPUT
            else
              echo "Error: No EML_1 or EML secrets found."
              exit 1
            fi
          else
            INDEX_ARRAY=$(echo "$ACCOUNTS" | jq -R . | jq -s -c .)
            echo "matrix=$INDEX_ARRAY" >> $GITHUB_OUTPUT
          fi

  renew:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_index: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: 📥 拉取仓库
        uses: actions/checkout@v4

      - name: 🟢 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖及浏览器
        run: |
          npm install
          npx playwright install --with-deps chrome
          sudo apt-get update
          sudo apt-get install -y jq fonts-noto-cjk

      - name: ⚙️ 设置代理环境
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          chmod +x setup_proxy.sh
          bash setup_proxy.sh

      - name: 🔧 执行自动续期
        env:
          ACC: ${{ matrix.account_index == 'SINGLE' && secrets.EML || secrets[format('EML_{0}', matrix.account_index)] }}
          ACC_PWD: ${{ matrix.account_index == 'SINGLE' && secrets.PWD || secrets[format('PWD_{0}', matrix.account_index)] }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ID: ${{ secrets.TG_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          T: ${{ secrets.T }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force || false }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SCRIPT_NAME: ${{ secrets.CF_SCRIPT_NAME }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node renew.js

      - name: 🖼️ 上传截图留存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.account_index }}
          path: "*.png"
          retention-days: 5

  cleanup:
    needs: renew
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 拉取仓库
        uses: actions/checkout@v4

      - name: ⏱️ 更新运行记录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "最后运行时间: $(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 自动更新运行记录，保活 Actions [skip ci]"
            # ✅ 正确合并远程分支，防止 multi-matrix 时的推送冲突
            git pull origin ${GITHUB_REF_NAME} --rebase || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: 🧹 清理历史运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" -L 100 --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "🗑️ 正在删除多余的历史记录 ID: $run"
              gh run delete "$run" || true
            fi
          done
